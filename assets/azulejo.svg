<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <rect width="120" height="120" fill="#fffcf3"/>
  <g fill="none" stroke="#627f62" stroke-width="1.4">
    <rect x="0.7" y="0.7" width="118.6" height="118.6" stroke-opacity=".35"/>
    <!-- quartos de círculo nos cantos: formam círculos ao repetir -->
    <path d="M0 26 A26 26 0 0 0 26 0 M94 0 A26 26 0 0 0 120 26 M120 94 A26 26 0 0 0 94 120 M26 120 A26 26 0 0 0 0 94"/>
    <path d="M0 16 A16 16 0 0 0 16 0 M104 0 A16 16 0 0 0 120 16 M120 104 A16 16 0 0 0 104 120 M16 120 A16 16 0 0 0 0 104" stroke-opacity=".6"/>
    <!-- losango -->
    <path d="M60 14 L106 60 L60 106 L14 60 Z" stroke-opacity=".55"/>
    <!-- arabescos entre cantos e losango -->
    <path d="M30 6 Q42 20 36 32 M90 6 Q78 20 84 32 M114 30 Q100 42 88 36 M114 90 Q100 78 88 84 M90 114 Q78 100 84 88 M30 114 Q42 100 36 88 M6 90 Q20 78 32 84 M6 30 Q20 42 32 36" stroke-opacity=".7"/>
  </g>
  <!-- roseta central de 8 pétalas -->
  <g transform="translate(60 60)" stroke="#627f62" stroke-width="1.3" fill="#e6e6da">
    <g id="p"><ellipse cx="0" cy="-19" rx="6.5" ry="15"/></g>
    <use href="#p" transform="rotate(45)"/><use href="#p" transform="rotate(90)"/><use href="#p" transform="rotate(135)"/>
    <use href="#p" transform="rotate(180)"/><use href="#p" transform="rotate(225)"/><use href="#p" transform="rotate(270)"/><use href="#p" transform="rotate(315)"/>
    <circle r="8" fill="#627f62"/><circle r="3.5" fill="#fffcf3" stroke="none"/>
  </g>
  <!-- pontos -->
  <g fill="#627f62"><circle cx="60" cy="3" r="2"/><circle cx="117" cy="60" r="2"/><circle cx="60" cy="117" r="2"/><circle cx="3" cy="60" r="2"/></g>
</svg>
